[package]
name = "isoncorrect"
# Cargo requires semver, but the tool's advertised version is the four-component
# "0.1.3.5" that the Python implementation prints. The CLI version string lives
# in `cli::VERSION` and is what `--version` emits; keep the two in step.
version = "0.1.3"
edition = "2021"
# Raised from 1.74 by spoars, which requires 1.85.
rust-version = "1.85"
description = "De novo error-correction of long-read transcriptome reads"
repository = "https://github.com/ksahlin/isONcorrect"
license = "GPL-3.0-only"

[dependencies]
clap = { version = "4", features = ["derive"] }
indexmap = "2.11.4"
rapidfuzz = "0.5.0"
# The structural-overcorrection guard's aligner. SIMD (Neon/AVX2/SSE2) and
# adaptively banded, so it is 8-99x faster than the exact DP it replaces.
# Verified to find an optimal score on 1 400 of 1 400 recorded alignments; it
# differs from parasail only in which equally-optimal path it reports. See
# `guard::align` and PORTING.md.
block-aligner = { version = "0.5.1", features = ["simd_neon"] }
spoars = "0.1.3"
rustc-hash = "2.1.3"

[dev-dependencies]

[lib]
name = "isoncorrect"
path = "src/lib.rs"

# Binary names must match the Python entry points exactly; existing pipelines
# invoke them by these names.
[[bin]]
name = "isONcorrect"
path = "src/bin/isoncorrect.rs"

[[bin]]
name = "run_isoncorrect"
path = "src/bin/run_isoncorrect.rs"

# Development tool for stage-by-stage diffing against the reference; not part
# of the shipped CLI contract.
[[bin]]
name = "isoncorrect-dump"
path = "src/bin/dump_stages.rs"

[profile.release]
lto = "thin"
codegen-units = 1
