# Build release binaries and attach them to the GitHub Release for a tag.
#
# Triggered by pushing a tag like v0.2.0. Creates the release if it does not
# already exist, then uploads one tarball per target. Nothing here publishes to
# crates.io or PyPI.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # `native: true` means the runner can execute what it just built, so the
        # smoke test runs. Cross-compiled targets are built and packaged but not
        # executed here.
        #
        # Both libc flavours ship for Linux, on purpose:
        #   gnu  - faster, but needs glibc >= 2.34, so it will NOT run on
        #          CentOS 7, RHEL 8, Ubuntu 20.04 or Debian 11.
        #   musl - statically linked, runs on any Linux however old. musl's
        #          allocator is slower than glibc's and isONcorrect is
        #          allocation-sensitive, so prefer gnu when your glibc allows it.
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            native: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            native: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            native: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            native: true
          - os: macos-latest
            target: aarch64-apple-darwin
            native: true
          # Cross-compiled from the arm runner rather than built on macos-13,
          # which GitHub has retired -- a job targeting it sits queued forever.
          - os: macos-latest
            target: x86_64-apple-darwin
            native: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: build
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}
      - name: smoke-test the binaries actually run
        if: matrix.native
        working-directory: rust
        run: |
          bin="target/${{ matrix.target }}/release"
          "$bin/isONcorrect" --version
          "$bin/run_isoncorrect" --version
          "$bin/isONcorrect" --fastq ../test_data/isoncorrect/0.fastq --outfolder /tmp/smoke
          test -s /tmp/smoke/corrected_reads.fastq
          # 100 reads in, 100 reads out.
          test "$(wc -l < /tmp/smoke/corrected_reads.fastq)" -eq 400
      - name: package
        working-directory: rust
        run: |
          name="isONcorrect-${{ github.event.inputs.tag || github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/isONcorrect" \
             "target/${{ matrix.target }}/release/run_isoncorrect" "dist/$name/"
          cp ../README.md ../LICENSE.txt "dist/$name/" 2>/dev/null || true
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          # Written from inside dist/ so the file records a bare filename. Doing
          # it from the parent embeds "dist/..." in the checksum line, and then
          # `shasum -c` fails for anyone who downloaded the tarball into their own
          # directory -- which is everyone. v0.2.0 shipped that way at first.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            rust/dist/*.tar.gz
            rust/dist/*.tar.gz.sha256
          fail_on_unmatched_files: true
